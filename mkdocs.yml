site_name: RAG Pipelines Mastery Path
site_description: A structured, module-wise training program on Retrieval-Augmented Generation — from your first embedding to production-grade RAG systems, with runnable Python code in every module.
site_url: https://sigilipelli.github.io/rag-skillmastery/
repo_url: https://github.com/SIGILIPELLI/rag-skillmastery
repo_name: rag-skillmastery

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is RAG & Why It Exists": level-1/01-what-is-rag.md
      - "02 · Embeddings & Semantic Similarity": level-1/02-embeddings.md
      - "03 · Chunking Strategies": level-1/03-chunking.md
      - "04 · Vector Stores (ChromaDB)": level-1/04-vector-stores.md
      - "05 · Retrieval": level-1/05-retrieval.md
      - "06 · Prompt Assembly & Generation": level-1/06-prompt-assembly-generation.md
      - "07 · A Minimal End-to-End Pipeline": level-1/07-minimal-pipeline.md
      - "08 · Evaluating RAG": level-1/08-evaluating-rag.md
      - "09 · Common Failure Modes": level-1/09-failure-modes.md
